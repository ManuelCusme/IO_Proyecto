[project]
name = "simplexlab"
version = "0.1.0"
description = "Programación lineal exacta con Simplex Gran M y método gráfico"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["core"]

[tool.coverage.report]
fail_under = 80
